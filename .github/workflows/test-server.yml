name: Test PRIVSIG PostgreSQL backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Server/**', 'render.yaml', '.github/workflows/test-server.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_USER: privsig
          POSTGRES_DB: privsig_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r Server/requirements-server.txt pytest httpx
      - run: python -m pytest Server/tests -q
        env:
          TEST_POSTGRES_URL: postgresql://privsig:integration-only-password@127.0.0.1:5432/privsig_test
